<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-info">
            <h1>Pong Game</h1>
            <div class="scoreboard">
                <div class="score">
                    <h2>Player</h2>
                    <p id="playerScore">0</p>
                </div>
                <div class="divider">:</div>
                <div class="score">
                    <h2>Computer</h2>
                    <p id="computerScore">0</p>
                </div>
            </div>
        </div>

        <canvas id="pongCanvas"></canvas>

        <div class="controls">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Move Mouse Up/Down or ⬆️⬇️ Arrow Keys to control left paddle</p>
            <p>Press <strong>SPACEBAR</strong> to start/pause the game</p>
        </div>
    </div>

    <script src="pong.js"></script>
</body>
</html>
